<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="marbleGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="85%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Base Frame -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.8"/>

  <!-- Orbital Ring Behind -->
  <ellipse cx="256" cy="275" rx="195" ry="58" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.4" transform="rotate(-22 256 275)"/>

  <!-- Glowing Marble Shadow -->
  <ellipse cx="256" cy="405" rx="130" ry="26" fill="#000000" opacity="0.6"/>

  <!-- Flag Sphere / Marble -->
  <circle cx="256" cy="265" r="140" fill="url(#marbleGrad)" filter="url(#glow)"/>

  <!-- Flag Stripes / Globe Latitudes -->
  <path d="M 125 240 Q 256 295 387 240" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <path d="M 142 300 Q 256 345 370 300" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <path d="M 145 190 Q 256 240 367 190" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round" opacity="0.85"/>

  <!-- Marble Sphere Highlight -->
  <ellipse cx="205" cy="180" rx="42" ry="24" fill="#ffffff" opacity="0.55" transform="rotate(-30 205 180)"/>

  <!-- Orbital Ring Front -->
  <path d="M 80 240 A 195 58 0 0 0 432 310" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" transform="rotate(-22 256 275)"/>

  <!-- Floating Golden Crown on Top -->
  <g transform="translate(256, 105) scale(1.15)">
    <path d="M -60 25 L -45 -25 L -15 0 L 0 -35 L 15 0 L 45 -25 L 60 25 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="-45" cy="-28" r="6" fill="#ef4444"/>
    <circle cx="0" cy="-38" r="8" fill="#38bdf8"/>
    <circle cx="45" cy="-28" r="6" fill="#10b981"/>
    <rect x="-60" y="24" width="120" height="12" rx="4" fill="#d97706"/>
  </g>
</svg>
